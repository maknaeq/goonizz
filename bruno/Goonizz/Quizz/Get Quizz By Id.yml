info:
  name: Get Quizz By Id
  type: http
  seq: 3

http:
  method: GET
  url: "{{BASE_URL}}quizzs/{{quizzId}}"
  auth: inherit

docs: |-
  Run "Create Quizz" first so `quizzId` is set. Returns the quizz with
  its questions and choices. The `isCorrect` field on choices is only
  included when the signed-in user is the quizz's author, otherwise it
  is stripped so players can't see the answers ahead of time.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return status 200", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("should return the quizz with its questions", function() {
          const body = res.getBody();
          expect(body).to.have.property('questions');
          expect(body.questions).to.be.an('array');
        });
