info:
  name: Get Media
  type: http
  seq: 3

http:
  method: GET
  url: "{{BASE_URL}}media/{{mediaId}}"
  auth: inherit

docs: |-
  Run "Upload Media" first. Public route, serves the stored file as-is.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return status 200", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("should return the media as a webp image", function() {
          expect(res.getHeader('content-type')).to.include('image/webp');
        });
