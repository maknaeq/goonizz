info:
  name: Get Quizzs
  type: http
  seq: 2

http:
  method: GET
  url: "{{BASE_URL}}quizzs"
  auth: inherit

docs: |-
  Public route, no need to sign in first. Lists every quizz with its
  author (password stripped).

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return status 200", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("should return an array of quizzs", function() {
          expect(res.getBody()).to.be.an('array');
        });
