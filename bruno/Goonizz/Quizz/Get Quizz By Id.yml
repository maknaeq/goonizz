info:
  name: Get Quizz By Id
  type: http
  seq: 3

http:
  method: GET
  url: "{{BASE_URL}}quizzs/{{quizzId}}"
  auth: inherit

docs: |-
  Run "Create Quizz" first. correctAnswer is stripped unless you're the
  quizz's author.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return status 200", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("should return the quizz with its questions", function() {
          const body = res.getBody();
          expect(body).to.have.property('questions');
          expect(body.questions).to.be.an('array');
        });
