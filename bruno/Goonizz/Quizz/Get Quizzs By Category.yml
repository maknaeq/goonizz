info:
  name: Get Quizzs By Category
  type: http
  seq: 10

http:
  method: GET
  url: "{{BASE_URL}}quizzs?categoryId={{categoryId}}"
  auth: inherit

docs: |-
  Run "Create Question" first. Public route, no need to sign in.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return status 200", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("should return an array containing the quizz with a question in that category", function() {
          const body = res.getBody();
          expect(body).to.be.an('array');
          const ids = body.map((quizz) => quizz.id);
          expect(ids).to.include(bru.getVar('quizzId'));
        });
