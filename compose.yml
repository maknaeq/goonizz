services:
  db:
    image: postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: secret
    networks:
      - app-network
    volumes:
      - "/var/lib/postgresql"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-d", "postgres"]
      interval: 30s
      timeout: 60s
      retries: 5

  api:
    build:
      context: .
      target: dev
    restart: always
    ports:
      - 3000:3000
    environment:
      PORT: 3000
    volumes:
      - ./:/app
      - /app/node_modules
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy

networks:
  app-network:

volumes:
  pgdata:
