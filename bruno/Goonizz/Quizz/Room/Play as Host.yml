info:
  name: Play as Host
  type: websocket
  seq: 1
  tags: [ws]

websocket:
  url: "{{WS_BASE_URL}}"
  headers:
    - name: Cookie
      value: "token={{token}}"
  auth: none
  message:
    type: json
    data: |-
      {
        "type": "room:create",
        "requestId": "1",
        "payload": { "quizzId": {{quizzId}} }
      }

docs: |-
  Bruno's WS client only works in the desktop app, one connection where
  you send messages manually. It ignores the shared cookie jar too, the
  token is sent as a `Cookie` header via `{{token}}` (set by "Sign In").

  Run "Sign In" + "Create Quizz" first, then in the app:

  1. Connect, send the pre-filled `room:create` message, get the code back.
  2. Once the player's joined: `room:start` → you get `question:show` pushes.
  3. After each question: `room:next` → next question, or once the last
     one's done, a `review:answer` push (only to you) with one player's
     raw answer to check against `correctAnswer`.
  4. For each one, reply with `review:decide { code, valid }`. Repeat until
     `room:finished` with the scoreboard — points only count for answers
     you marked valid, there's no auto-scoring anymore.

settings:
  timeout: 0
  keepAliveInterval: 0
