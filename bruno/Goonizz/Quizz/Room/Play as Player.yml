info:
  name: Play as Player
  type: websocket
  seq: 2
  tags: [ws]

websocket:
  url: "{{WS_BASE_URL}}"
  headers:
    - name: Cookie
      value: "token={{token}}"
  auth: none
  message:
    type: json
    data: |-
      {
        "type": "room:join",
        "requestId": "1",
        "payload": { "code": "PASTE_ROOM_CODE_HERE" }
      }

docs: |-
  Sign in as a different user first (running "Sign In" again overwrites
  `token`, so use a second tab/window, or re-sign-in right before this).
  Replace "PASTE_ROOM_CODE_HERE" with the code from "Play as Host".

  Connect, send `room:join`, then on each `question:show` answer with
  free text: `answer:submit { code, text }`. One answer per question,
  no immediate feedback — the host reviews everything at the end, you
  just get the next question or `room:finished`.

settings:
  timeout: 0
  keepAliveInterval: 0
