info:
  name: Create Question
  type: http
  seq: 4

http:
  method: POST
  url: "{{BASE_URL}}quizzs/{{quizzId}}/questions"
  body:
    type: json
    data: |-
      {
          "text": "Quels langages sont compiles ?",
          "choices": [
              { "text": "TypeScript", "isCorrect": true },
              { "text": "Python", "isCorrect": false },
              { "text": "Go", "isCorrect": true }
          ]
      }
  auth: inherit

docs: |-
  Run "Sign In" then "Create Quizz" first (`quizzId` must be set, and
  you must be the quizz's author). At least 2 choices and at least one
  correct choice are required. The created question's id is stored in
  the `questionId` variable for "Delete Question".

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return status 201", function() {
          expect(res.getStatus()).to.equal(201);
        });

        test("should return the created question with its choices", function() {
          const body = res.getBody();
          expect(body).to.have.property('id');
          expect(body.choices).to.be.an('array').with.length(3);
          bru.setVar("questionId", body.id);
        });
