info:
  name: Create Question
  type: http
  seq: 4

http:
  method: POST
  url: "{{BASE_URL}}quizzs/{{quizzId}}/questions"
  body:
    type: json
    data: |-
      {
          "text": "Qui a ecrit 'Les Miserables' ?",
          "categoryId": {{categoryId}},
          "correctAnswer": "Victor Hugo"
      }
  auth: inherit

docs: |-
  Run "Sign In", "Create Category" and "Create Quizz" first. Stores the
  question id in `questionId`. Free-text answer, no more choices.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return status 201", function() {
          expect(res.getStatus()).to.equal(201);
        });

        test("should return the created question", function() {
          const body = res.getBody();
          expect(body).to.have.property('id');
          expect(body.correctAnswer).to.equal('Victor Hugo');
          expect(body.type).to.equal('classic');
          expect(body.categoryId).to.equal(bru.getVar('categoryId'));
          bru.setVar("questionId", body.id);
        });
