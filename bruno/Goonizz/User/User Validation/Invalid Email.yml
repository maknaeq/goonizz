info:
  name: Invalid Email
  type: http
  seq: 1

http:
  method: POST
  url: "{{BASE_URL}}users"
  body:
    type: json
    data: '{ "email": "not-an-email", "password": "password123", "role": "user" }'
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return status 400", function() { expect(res.getStatus()).to.equal(400); });                                                                                                                 
          test("should return an errors array", function() { expect(res.getBody().errors).to.be.an('array').that.is.not.empty; });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
