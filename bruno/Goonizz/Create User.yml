info:
  name: Create User
  type: http
  seq: 2

http:
  method: POST
  url: "{{BASE_URL}}users"
  body:
    type: json
    data: |-
      {                  
          "email": "user@example.com",                       
          "password": "password123",                                   
          "role": "user"                                          
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
