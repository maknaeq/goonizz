info:
  name: Short Password
  type: http
  seq: 2

http:
  method: POST
  url: "{{BASE_URL}}users"
  body:
    type: json
    data: '{ "email": "short-password@example.com", "password": "short1", "role": "user" }'
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return status 400", function() { expect(res.getStatus()).to.equal(400); });
        test("should return an errors array", function() { expect(res.getBody().errors).to.be.an('array').that.is.not.empty; });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
