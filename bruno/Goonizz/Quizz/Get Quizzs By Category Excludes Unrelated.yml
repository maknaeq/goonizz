info:
  name: Get Quizzs By Category Excludes Unrelated
  type: http
  seq: 11

http:
  method: GET
  url: "{{BASE_URL}}quizzs?categoryId={{otherCategoryId}}"
  auth: inherit

docs: |-
  Run "Create Second Category" and "Create Question" first. Proves the filter actually excludes, not just includes.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return status 200", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("should not return the quizz that has no question in this category", function() {
          const body = res.getBody();
          expect(body).to.be.an('array');
          const ids = body.map((quizz) => quizz.id);
          expect(ids).to.not.include(bru.getVar('quizzId'));
        });
