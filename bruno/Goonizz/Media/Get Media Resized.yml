info:
  name: Get Media Resized
  type: http
  seq: 4

http:
  method: GET
  url: "{{BASE_URL}}media/{{mediaId}}?width=100"
  auth: inherit

docs: |-
  Run "Upload Media" first. Same params work for video (`?resolution=`)
  and audio (`?quality=`).

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return status 200", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("should return a webp image", function() {
          expect(res.getHeader('content-type')).to.include('image/webp');
        });
