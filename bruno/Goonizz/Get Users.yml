info:
  name: Get Users
  type: http
  seq: 1

http:
  method: GET
  url: "{{BASE_URL}}users"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

tests: |
  test("should return status 200", function() {
    expect(res.getStatus()).to.equal(200);
  });

  test("should return an array of users", function() {
    expect(res.getBody()).to.be.an('array');
  });

  test("should not return passwords", function() {
    res.getBody().forEach((user) => {
      expect(user).to.not.have.property('password');
    });
  });
